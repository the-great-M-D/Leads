services:
  # ── Main scanner — runs every 6 hours ─────────────────────────────────────
  - type: cron
    name: tree-lead-radar
    runtime: python
    buildCommand: bash build.sh
    schedule: "0 */6 * * *"
    startCommand: python Radar.py
    disk:
      name: radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: FB_EMAIL
        sync: false
      - key: FB_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/leads.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false

  # ── Daily summary email — 7am SAST (05:00 UTC) ────────────────────────────
  - type: cron
    name: tree-lead-daily-summary
    runtime: python
    buildCommand: bash build.sh
    schedule: "0 5 * * *"
    startCommand: python daily_summary.py
    disk:
      name: radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/leads.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
